<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same mark as the mobile app — public/logo.png is a byte-for-byte copy of
         LibotBulacan/assets/logo.png, so the tab icon and the app icon can't drift. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Libot Admin</title>
    <!-- Applies the saved theme before first paint (see public/theme-init.js).
         A plain blocking script on purpose: it must run before the body renders. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
