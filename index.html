<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same mark as the mobile app — public/logo.png is a byte-for-byte copy of
         LibotBulacan/assets/logo.png, so the tab icon and the app icon can't drift. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Libot Admin</title>
    <!-- Applies the saved theme BEFORE first paint. Without this, someone who
         picked dark gets a flash of the light page while the bundle loads and
         React mounts. Deliberately inline and dependency-free so it runs
         synchronously in <head>. "system" writes no attribute, which lets the
         prefers-color-scheme query in index.css take over. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('libot_admin_theme');
          if (p === 'light' || p === 'dark') {
            document.documentElement.setAttribute('data-theme', p);
          }
        } catch (e) { /* private mode — fall back to the OS preference */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
